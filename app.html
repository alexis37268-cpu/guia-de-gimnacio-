<title>Rutina de Arranque</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: una columna tipo guía de bolsillo; color de cada día = disco olímpico (rojo 25, azul 20, amarillo 15) */
:root{
  --bg:#EDEFF0; --surface:#FFFFFF; --ink:#16191D; --muted:#5D646C; --line:#D6DADE; --far:#A3AAB1; --prop:#7C848C;
  --d1:#C9362A; --d2:#1E5DBA; --d3:#D99A00; --on1:#FFFFFF; --on2:#FFFFFF; --on3:#16191D;
  --ok:#2E8048; --water:#2A86C9; --acc:var(--d1); --on:var(--on1);
  --display:"Saira Extra Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1A1D20; --ink:#E8EBED; --muted:#9BA2A9; --line:#2B3034; --far:#565D64; --prop:#7D858C;
  --d1:#EE5547; --d2:#5A8FE8; --d3:#F2BC2C; --on1:#111315; --on2:#111315; --on3:#111315; --ok:#4CB37A; --water:#55A8E6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1A1D20; --ink:#E8EBED; --muted:#9BA2A9; --line:#2B3034; --far:#565D64; --prop:#7D858C;
  --d1:#EE5547; --d2:#5A8FE8; --d3:#F2BC2C; --on1:#111315; --on2:#111315; --on3:#111315; --ok:#4CB37A; --water:#55A8E6; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 60px}
body[data-day="1"]{--acc:var(--d1);--on:var(--on1)}
body[data-day="2"]{--acc:var(--d2);--on:var(--on2)}
body[data-day="3"]{--acc:var(--d3);--on:var(--on3)}
body[data-day="p"]{--acc:var(--ink);--on:var(--bg)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;margin:0;line-height:1;text-wrap:balance}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:36px;font-weight:800}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);padding:4px;border-radius:12px}
.tab{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:10px 6px;cursor:pointer;font:600 15px var(--body)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--acc);padding:2px 0 2px 12px;margin:0}
#view{display:flex;flex-direction:column;gap:22px}
.hero{background:var(--acc);color:var(--on);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.hero .eyebrow{color:inherit;opacity:.8}
.hero h2{font-size:38px;font-weight:800}
.hero p{margin:0;font-size:15px}
.hero .lead{font-family:var(--display);font-size:24px;text-transform:uppercase;font-weight:600}
.hero .ghost{align-self:flex-start;border-color:currentColor;color:inherit;margin-top:6px}
.switch{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin-top:4px}
.switch span{opacity:.85}
.switch button{border:1.5px solid currentColor;background:transparent;color:inherit;font:600 13px var(--body);padding:5px 10px;border-radius:999px;cursor:pointer}
.gymbar{background:var(--surface);border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.gymbar div{display:flex;flex-direction:column;min-width:0}
.gymbar span{font-size:13.5px;color:var(--muted)}
.water{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.water .wi{width:14px;height:18px;border:2px solid var(--water);border-radius:2px 2px 6px 6px;background:linear-gradient(transparent 45%,var(--water) 45%)}
.water span:nth-child(2){flex:1}
.water button{border:1.5px solid var(--water);background:transparent;color:var(--water);font:600 14px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
section{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:4px}
section h2{font-size:26px;font-weight:700}
.sechead small{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border-radius:14px;padding:12px;display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:start}
.card.done{box-shadow:inset 0 0 0 2px var(--ok)}
.card.done .fig{opacity:.55}
.fig{width:100%;height:auto;aspect-ratio:1;background:var(--bg);border-radius:10px;max-width:100%;display:block}
.info{min-width:0;display:flex;flex-direction:column;gap:8px}
h3{font-size:22px;font-weight:700}
.mus{font-size:13.5px;color:var(--muted);margin-top:2px}
.rx{display:flex;flex-direction:column;gap:2px}
.rx .big{font-family:var(--display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.rx .rest{font-size:13px;color:var(--muted)}
.how{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px}
.how summary{cursor:pointer;font-weight:600;font-size:14.5px}
.how ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.cardfoot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tick{border:2px solid var(--ok);background:transparent;color:var(--ok);font:700 15px var(--body);padding:10px 16px;border-radius:999px;cursor:pointer;min-width:150px}
.tick.on{background:var(--ok);color:var(--surface)}
.quit{background:none;border:0;color:var(--muted);font:500 13.5px var(--body);cursor:pointer;padding:6px;text-decoration:underline}
.alt{grid-column:1/-1;background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.alt p{margin:0;font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.add{border:1.5px dashed var(--ink);background:var(--surface);color:var(--ink);font:500 14px var(--body);padding:8px 12px;border-radius:999px;cursor:pointer;text-align:left}
.mini{background:var(--surface);border-radius:12px;padding:8px 12px 8px 8px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.mini .info{gap:2px}
.mini h3{font-size:19px}
.mini p{margin:0;font-size:13.5px;color:var(--muted)}
.go{border:0;background:var(--acc);color:var(--on);font:700 15px var(--body);padding:12px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.ghost{background:none;border:1.5px solid var(--line);color:var(--ink);font:600 14px var(--body);padding:10px 16px;border-radius:999px;cursor:pointer}
.wide{align-self:stretch;width:100%}
.panel{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px}
.panel input{font:500 16px var(--body);padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wdays button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px var(--body);padding:10px 0;border-radius:10px;cursor:pointer;min-width:0}
.wdays button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hr{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-size:15px}
.dtabs{display:flex;gap:8px}
.dtabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px var(--body);padding:10px 0;border-radius:10px;cursor:pointer}
.dtabs button[aria-pressed="true"]{border-color:var(--acc)}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.plist{background:var(--surface);border-radius:14px;padding:4px 12px}
.plist h4{margin:10px 0 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr 104px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prow label{display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
.prow input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.prow label span{display:flex;flex-direction:column;min-width:0}
.prow b{font-weight:600;font-size:15px;line-height:1.25}
.prow small{font-size:12.5px;color:var(--muted)}
.prow input[type=text]{width:100%;min-width:0;font:600 14px var(--body);padding:7px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:center}
.prow input[type=text]:disabled{opacity:.4}
.prow:not(.on) b{color:var(--muted);font-weight:500}
.empty{color:var(--muted);font-size:14px;margin:0}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.hist{display:flex;flex-direction:column}
.hist div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.hist div:last-child{border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));width:min(560px,calc(100% - 32px));background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;box-shadow:0 8px 30px rgb(0 0 0 / .25);display:flex;gap:10px;align-items:center;z-index:9;border-left:5px solid var(--ok)}
.toast.w{border-left-color:var(--water)}
.toast p{margin:0;flex:1;font-size:15px;font-weight:500}
.toast button{border:0;background:var(--water);color:var(--surface);font:600 14px var(--body);padding:9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.toast .x{background:none;color:var(--muted);padding:6px;font-size:18px}
.trainbtn{display:flex;align-items:center;justify-content:center;gap:10px}
.train{position:fixed;inset:0;z-index:8;background:var(--bg);overflow-y:auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tin{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px}
.ttop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ttop button{background:none;border:1.5px solid var(--line);color:var(--ink);font:600 14px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer}
.tbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--acc)}
.train .fig{width:min(100%,46vh);margin:0 auto;background:var(--surface)}
.train h2{font-size:34px;font-weight:800;text-align:center}
.tsub{text-align:center;color:var(--muted);font-size:14px;margin-top:-6px}
.tset{text-align:center;font-family:var(--display);text-transform:uppercase;font-size:22px;font-weight:700}
.tset b{font-size:44px;color:var(--acc)}
body[data-day="3"] .tset b{color:var(--ink)}
.tbig{font-family:var(--display);font-size:96px;font-weight:800;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.tnext{text-align:center;font-size:15px;color:var(--muted)}
.tmain{width:100%;border:0;background:var(--acc);color:var(--on);font:700 20px var(--body);padding:20px;border-radius:16px;cursor:pointer}
.trow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.trow button{background:none;border:1.5px solid var(--line);color:var(--ink);font:600 14px var(--body);padding:10px 14px;border-radius:999px;cursor:pointer}
.train .how{border-top:1px solid var(--line)}
.twl{font-size:12.5px;color:var(--muted);text-align:center}
.bmap{background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.bmap svg{width:100%;max-width:560px;height:auto;margin:0 auto;display:block}
.bmap .m{fill:transparent;stroke:none;cursor:pointer;transition:fill .15s}
.bmap .m.has{fill:var(--ok);fill-opacity:.38}
.bmap .m.sel{fill:var(--acc);fill-opacity:.6}
.bmap .m:focus-visible{outline:none;stroke:var(--ink);stroke-width:2}
.bmap text{font-family:var(--body);font-weight:700;fill:#5D646C;letter-spacing:.08em}
.bcap{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.bcap b{color:var(--ink)}
.bcap button{background:none;border:1.5px solid var(--line);color:var(--ink);font:600 13px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.leg{display:inline-flex;align-items:center;gap:5px}.leg i{width:12px;height:12px;border-radius:3px;background:var(--ok);opacity:.45}
.credit{font-size:11.5px;color:var(--muted);text-align:center;margin:0}
@media (max-width:380px){.card{grid-template-columns:88px 1fr}h1{font-size:32px}.prow{grid-template-columns:1fr 88px}.hero h2{font-size:32px}}
</style>

<script>
// ================== poses (vista 200x200, piso y=181) ==================
const S={h:[100,38],n:[100,54],p:[100,108],e:[101,80],w:[102,104],k:[101,143],a:[100,178]};
const F={h:[100,38],n:[100,54],p:[100,108],e:[88,80],w:[86,104],e2:[112,80],w2:[114,104],k:[93,143],a:[92,178],k2:[107,143],a2:[108,178]};

const LB={h:[52,108],n:[66,116],p:[118,120],k:[142,136],a:[150,178]};
const P=(b,o)=>Object.assign({},b,o);
const sh=(b,dx,dy)=>{const r={};for(const k in b)r[k]=[b[k][0]+dx,b[k][1]+dy];return r};
const SQ_DOWN={h:[108,76],n:[104,92],p:[78,140],k:[112,140],a:[100,178]};
const ALL4={n:[132,138],p:[80,140],e:[132,158],w:[132,178],k:[80,178],a:[56,180]};
const R1={p:[100,98],n:[148,92],h:[160,86],k:[92,138],a:[90,178],k2:[116,122],a2:[146,121],e2:[152,108],w2:[154,122]};
const SEATX={h:[72,44],n:[72,60],p:[74,114],k:[108,118],e:[76,88],w:[86,114]};
const LIE={h:[40,170],n:[54,172],p:[100,172],k:[124,140],a:[140,178],e:[72,177],w:[90,178]};
const PB={h:[100,70],n:[100,82],p:[100,100],k:[93,140],a:[92,178],k2:[107,140],a2:[108,178]};
const MIL_A=P(F,{e:[76,66],w:[78,42],e2:[124,66],w2:[122,42]}),MIL_B=P(F,{e:[82,32],w:[84,6],e2:[118,32],w2:[116,6]});
const BENCH=[{t:"rect",x:42,y:126,w:104,h:7},{t:"rect",x:56,y:133,w:6,h:48},{t:"rect",x:126,y:133,w:6,h:48}];
const BANCA=[P(LB,{e:[70,94],w:[72,70]}),P(LB,{e:[60,134],w:[70,110]})];
const SEATM=[{t:"rect",x:58,y:118,w:46,h:7},{t:"rect",x:56,y:60,w:7,h:58},{t:"rect",x:62,y:125,w:6,h:56}];
function circleArms(){const o=[];for(let i=0;i<8;i++){const a=-Math.PI/2+i*Math.PI/4;o.push(P(S,{w:[100+50*Math.cos(a),54+50*Math.sin(a)],e:[100+25*Math.cos(a),54+25*Math.sin(a)]}))}return o}
function hipCircle(){return[[-8,0],[0,-4],[8,0],[0,4]].map(([x,y])=>P(F,{p:[100+x,108+y],e:[80+x*.5,78],w:[90+x,104+y],e2:[120+x*.5,78],w2:[110+x,104+y],k:[93+x*.4,143],k2:[107+x*.4,143]}))}
const WALK=[P(S,{k:[108,142],a:[116,178],k2:[96,143],a2:[86,178],e:[95,80],w:[88,102],e2:[106,80],w2:[114,100]}),P(S,{k:[96,143],a:[86,178],k2:[108,142],a2:[116,178],e:[106,80],w:[114,100],e2:[95,80],w2:[88,102]})];

// ================== ejercicios ==================
// g: grupo · rx: series × reps · base: viene en la rutina · u:"s" segundos · nokg: sin peso
const EX={
 banca:{g:"pecho",base:1,name:"Press de banca",mus:"Pecho, tríceps, hombro",rx:"3 × 10",rest:90,props:BENCH,dyn:[{t:"plate",at:"w"}],poses:BANCA,
  tips:["Escápulas juntas y apoyadas en el banco, pies firmes en el piso.","Bajá controlado hasta la mitad del pecho, con los codos a unos 45°.","Las primeras veces, con alguien que te asista."]},
 inclinado:{g:"pecho",base:1,name:"Press inclinado con mancuernas",mus:"Pecho superior, hombro, tríceps",rx:"3 × 10–12",rest:75,
  props:[{t:"rect",x:80,y:138,w:42,h:7},{t:"poly",pts:"88,140 60,84",sw:8},{t:"rect",x:98,y:145,w:6,h:36}],dyn:[{t:"db",at:"w"}],
  poses:[{h:[60,78],n:[68,92],p:[95,135],k:[128,132],a:[132,178],e:[78,70],w:[86,46]},{h:[60,78],n:[68,92],p:[95,135],k:[128,132],a:[132,178],e:[56,110],w:[74,94]}],
  tips:["Respaldo a 30–45°.","Bajá hasta sentir el estiramiento en el pecho, sin rebotar.","Arriba, juntá apenas las mancuernas."]},
 aperturas:{g:"pecho",base:1,name:"Aperturas en máquina",mus:"Pecho",rx:"3 × 12",rest:60,

 martillo:{g:"biceps",base:1,name:"Curl martillo",mus:"Bíceps, antebrazo",rx:"3 × 12",rest:60,dyn:[{t:"dbv",at:"w"},{t:"dbv",at:"w2"}],

 jalon:{g:"espalda",base:1,name:"Jalón al pecho",mus:"Dorsales, bíceps",rx:"3 × 10–12",rest:90,
  props:[{t:"rect",x:78,y:112,w:44,h:7},{t:"rect",x:80,y:104,w:40,h:6}],dyn:[{t:"cable",from:[100,-15],to:"mid"},{t:"hbar"}],

const nextPause=()=>st.inGym?`Próxima pausa de agua: ${hhmm(st.inGym.last+PAUSA)}`:"";

// ================== vistas ==================
function tabs(){
  const box=$("tabs");box.innerHTML="";
  for(const[d,b]of[["hoy","Hoy"],["rutina","Mi rutina"],["prog","Progreso"]]){
    const t=document.createElement("button");t.className="tab";t.type="button";t.role="tab";t.setAttribute("aria-selected",st.tab===d);t.textContent=b;
    t.onclick=()=>{st.tab=d;save();render();window.scrollTo({top:0})};box.appendChild(t);
  }
}
function sec(v,title,sub){const s=document.createElement("section");s.innerHTML=`<div class="sechead"><h2>${title}</h2><small>${sub||""}</small></div>`;v.appendChild(s);return s}
function mini(s,def){
  const r=document.createElement("div");r.className="mini";const f=makeFig(def);figs.push(f);r.appendChild(f.svg);
  const i=document.createElement("div");i.className="info";i.innerHTML=`<h3>${def.name}</h3><p>${def.txt}</p>`;r.appendChild(i);s.appendChild(r);
}
function card(id,day,opts={}){
  const x=EX[id];const c=document.createElement("article");c.className="card";
  const f=makeFig(x);figs.push(f);c.appendChild(f.svg);
  const ticks=st.ticks[today]=st.ticks[today]||[];
  const info=document.createElement("div");info.className="info";
  info.innerHTML=`<div><h3>${x.name}</h3><div class="mus">${x.mus}</div></div>
    <div class="rx"><span class="big">${opts.home?x.rx:rxOf(day,id)}</span><span class="rest">descanso ${x.rest} s entre series</span></div>`;
  c.appendChild(info);
  const det=document.createElement("details");det.className="how";det.innerHTML=`<summary>Cómo hacerlo</summary><ul>${x.tips.map(t=>`<li>${t}</li>`).join("")}</ul>`;c.appendChild(det);
  const foot=document.createElement("div");foot.className="cardfoot";
  const tk=document.createElement("button");tk.type="button";tk.className="tick";
  const upd=()=>{const on=ticks.includes(id);tk.classList.toggle("on",on);tk.textContent=on?"✓ Hecho":"Marcar hecho";tk.setAttribute("aria-pressed",on);c.classList.toggle("done",on)};
  tk.onclick=()=>{const i=ticks.indexOf(id);if(i<0)ticks.push(id);else ticks.splice(i,1);save();upd();if(opts.onTick)opts.onTick()};
  foot.appendChild(tk);
  if(!opts.home){
    const no=document.createElement("button");no.type="button";no.className="quit";no.textContent="No está en mi gym";foot.appendChild(no);
    const alt=document.createElement("div");alt.className="alt";alt.hidden=true;
    const alts=(ALT[id]||[]).filter(a=>!st.plan[day].ids.includes(a));
    alt.innerHTML=`<p>${alts.length?"Podés hacer en su lugar:":"No hay reemplazo directo; podés sumar otro desde Mi rutina."}</p>`;
    const ch=document.createElement("div");ch.className="chips";
    alts.forEach(a=>{const b=document.createElement("button");b.type="button";b.className="add";b.textContent=EX[a].name+(EX[a].casa?" (sin máquina)":"");
      b.onclick=()=>{const L=st.plan[day].ids;L.splice(L.indexOf(id),1,a);save();render();toast(`Cambiado por ${EX[a].name}.`,{ms:3000})};ch.appendChild(b)});
    const rm=document.createElement("button");rm.type="button";rm.className="ghost";rm.textContent="Solo sacarlo";
    rm.onclick=()=>{st.plan[day].ids=st.plan[day].ids.filter(z=>z!==id);save();render();toast(`Sacaste ${x.name}. Lo podés volver a poner en Mi rutina.`,{ms:4000})};
    ch.appendChild(rm);alt.appendChild(ch);
    no.onclick=()=>{alt.hidden=!alt.hidden};
    c.appendChild(foot);c.appendChild(alt);
  }else c.appendChild(foot);
  upd();return c;
}
function waterLine(){
  const w=document.createElement("div");w.className="water";
  w.innerHTML=`<span class="wi" aria-hidden="true"></span><span data-water>${waterTxt()}</span><button type="button" aria-label="Sumar un vaso">+ vaso</button>`;
  w.querySelector("button").onclick=()=>addWater(1);return w;
}
function finish(day,home){
  st.done[today]={day,home:!!home,n:(st.ticks[today]||[]).length};st.next=String(day%3+1);st.inGym=null;delete st.override[today];save();render();window.scrollTo({top:0});
  toast(home?"Bien ahí: rutina en casa hecha.":"Entrenamiento terminado. ¡Bien ahí!",{ms:4000});
}
let homeMode=false;
function hoyView(v){
  const now=new Date();const day=todayDay();const D=DAYS[day];const done=st.done[today];
  const gym=isGymDay()||st.override[today]||done&&!done.rest;
  const hero=document.createElement("div");hero.className="hero";v.appendChild(hero);
  if(done){
    hero.innerHTML=`<div class="eyebrow">${WD[now.getDay()]} ${fmtD(today)}</div><h2>Día ${done.day} hecho ✓</h2><p>${done.home?"Rutina en casa.":DAYS[done.day].t+"."} La próxima vez te toca el Día ${st.next}: ${DAYS[st.next].t}.</p>`;
    v.appendChild(waterLine());
    const s=sec(v,"Estiramiento","si no lo hiciste");DAYS[done.day].st.forEach(id=>mini(s,ST[id]));
    return;
  }
  if(!gym){
    const nx=[1,2,3,4,5,6,7].map(i=>{const d=new Date();d.setDate(d.getDate()+i);return d}).find(d=>st.days.includes(d.getDay()));
    hero.innerHTML=`<div class="eyebrow">${WD[now.getDay()]} ${fmtD(today)}</div><h2>Hoy es descanso</h2><p>El músculo crece mientras descansa. Hoy, caminata y movilidad suave.${nx?` Próximo gym: ${WD[nx.getDay()].toLowerCase()}${st.hora?" a las "+st.hora:""}, Día ${st.next}.`:""}</p>`;
    const b=document.createElement("button");b.type="button";b.className="ghost";b.textContent="Igual voy al gym hoy";b.onclick=()=>{st.override[today]=st.next;save();render()};hero.appendChild(b);
    v.appendChild(waterLine());
    const s=sec(v,"Caminata","30–45 min · ritmo cómodo");mini(s,{name:"Caminata",txt:"Tenés que poder hablar sin ahogarte. Al aire libre, si se puede.",poses:WALK,dur:.55});
    const m=sec(v,"Movilidad","10 min · suave");[...MOV,ST.nino,ST.isquios,ST.cuadri,ST.cruzado].forEach(d=>mini(m,d));
    return;
  }
  hero.innerHTML=`<div class="eyebrow">${WD[now.getDay()]} ${fmtD(today)}${st.hora?" · "+st.hora+" h":""}</div><h2>Hoy te toca Día ${day}</h2><p class="lead">${D.t}</p>`;
  const sw=document.createElement("div");sw.className="switch";sw.innerHTML=`<span>¿Otro día?</span>`;
  ["1","2","3"].filter(d=>d!==day).forEach(d=>{const b=document.createElement("button");b.type="button";b.textContent="Día "+d;b.onclick=()=>{st.override[today]=d;save();render()};sw.appendChild(b)});
  hero.appendChild(sw);
  if(homeMode){
    const n=document.createElement("p");n.className="note";n.textContent="Rutina en casa con peso corporal para los mismos músculos. Hacé 3 vueltas o las series que dice cada uno.";v.appendChild(n);
    const back=document.createElement("button");back.type="button";back.className="ghost";back.textContent="Volver a la rutina del gym";back.onclick=()=>{homeMode=false;render()};v.appendChild(back);
    const m=sec(v,"Movilidad","5 min · antes de empezar");MOV.forEach(d=>mini(m,d));
    v.appendChild(trainButton(day,HOME[day],true));
    const e=sec(v,"En casa",D.t);HOME[day].forEach(id=>e.appendChild(card(id,day,{home:true})));
    const s=sec(v,"Estiramiento","5 min · al terminar");D.st.forEach(id=>mini(s,ST[id]));
    const f=document.createElement("button");f.type="button";f.className="go wide";f.textContent="Hice la rutina en casa";f.onclick=()=>{homeMode=false;finish(day,true)};v.appendChild(f);
    return;
  }
  const act=document.createElement("div");act.className="gymbar";
  if(st.inGym){
    act.innerHTML=`<div><b>En el gym desde las ${hhmm(st.inGym.t)}</b><span id="gymnext">${nextPause()}</span></div>`;
    const b=document.createElement("button");b.type="button";b.className="go";b.textContent="Terminé";b.onclick=()=>{finish(day,false);pantallaOff()};act.appendChild(b);
  }else{
    act.innerHTML=`<div><b>¿Ya estás en el gym?</b><span>Te aviso cada 15 min para tomar agua.</span></div>`;
    const b=document.createElement("button");b.type="button";b.className="go";b.textContent="Entré al gimnasio";
    b.onclick=()=>{try{actx=actx||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
      try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}
      st.inGym={d:today,t:Date.now(),last:Date.now()};save();pantallaOn();render()};
    act.appendChild(b);
  }
  v.appendChild(act);
  v.appendChild(waterLine());
  if(st.plan[day].ids.length)v.appendChild(trainButton(day,st.plan[day].ids,false));
  const m=sec(v,"Movilidad","5 min · antes de empezar");MOV.forEach(d=>mini(m,d));
  const ids=st.plan[day].ids;
  const e=sec(v,"Ejercicios",`${ids.length} ejercicios`);
  const cnt=()=>{const t=(st.ticks[today]||[]).filter(z=>ids.includes(z)).length;e.querySelector("small").textContent=`${t} de ${ids.length} hechos`};
  if(!ids.length)e.insertAdjacentHTML("beforeend",`<p class="empty">No elegiste ejercicios para este día. Sumalos en Mi rutina.</p>`);
  ids.forEach(id=>e.appendChild(card(id,day,{onTick:cnt})));cnt();
  const s=sec(v,"Estiramiento","5 min · al terminar");D.st.forEach(id=>mini(s,ST[id]));
  const no=document.createElement("button");no.type="button";no.className="ghost wide";no.textContent="Hoy no puedo ir al gym: rutina en casa";no.onclick=()=>{homeMode=true;render();window.scrollTo({top:0})};
  v.appendChild(no);
}

// ================== modo entrenamiento ==================
let TR=null,trT=null,wl=null,wlOK=null;
const setsOf=rx=>{const m=String(rx).match(/(\d+)\s*[×x]/);return m?+m[1]:3};
async function keepOn(){if(KA){pantallaOn();wlOK=true;const n=$("twl");if(n)n.textContent=wlTxt();return}try{wl=await navigator.wakeLock.request("screen");wlOK=true}catch(e){wl=null;wlOK=false}const n=$("twl");if(n)n.textContent=wlTxt()}
const wlTxt=()=>wlOK===true?"Pantalla encendida mientras entrenás":wlOK===false?"Este navegador no deja mantener la pantalla encendida (en el APK sí).":"";
document.addEventListener("visibilitychange",()=>{if(TR&&document.visibilityState==="visible")keepOn()});
function beep1(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.25)}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
function startTrain(day,ids,home){
  if(!ids.length)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  const tk=st.ticks[today]||[];let i=ids.findIndex(id=>!tk.includes(id));if(i<0)i=0;
  TR={day,ids,home,i,set:1,phase:"work",end:0,total:0};keepOn();$("train").hidden=false;document.body.style.overflow="hidden";drawTrain();
}
function exitTrain(){TR=null;clearInterval(trT);try{wl&&wl.release()}catch(e){}wl=null;pantallaOff();$("train").hidden=true;document.body.style.overflow="";render()}
function rxT(id){return TR.home?EX[id].rx:rxOf(TR.day,id)}
function drawTrain(){
  clearInterval(trT);const t=$("train");t.innerHTML="";figs=figs.filter(f=>!f.tr);
  const n=TR.ids.length;const tk=st.ticks[today]=st.ticks[today]||[];
  const w=document.createElement("div");w.className="tin";t.appendChild(w);
  const top=document.createElement("div");top.className="ttop";
  top.innerHTML=`<span>Ejercicio ${Math.min(TR.i+1,n)} de ${n}${TR.home?" · en casa":""}</span>`;
  const out=document.createElement("button");out.type="button";out.textContent="Salir";out.onclick=exitTrain;top.appendChild(out);w.appendChild(top);
  const bar=document.createElement("div");bar.className="tbar";bar.innerHTML=`<i style="width:${tk.filter(z=>TR.ids.includes(z)).length/n*100}%"></i>`;w.appendChild(bar);
  if(TR.phase==="end"){
    w.insertAdjacentHTML("beforeend",`<h2 style="margin-top:20vh">¡Terminaste!</h2><p class="tsub">Ahora estirá 5 minutos y tomá agua.</p>`);
    const b=document.createElement("button");b.className="tmain";b.type="button";b.textContent=TR.home?"Hice la rutina en casa":"Terminé el entrenamiento";
    b.onclick=()=>{const{day,home}=TR;TR=null;clearInterval(trT);try{wl&&wl.release()}catch(e){}$("train").hidden=true;document.body.style.overflow="";homeMode=false;finish(day,home)};
    w.appendChild(b);const k=document.createElement("button");k.type="button";k.className="ghost";k.textContent="Volver a la lista";k.onclick=exitTrain;w.appendChild(k);return;
  }
  const id=TR.ids[TR.i];const x=EX[id];const sets=setsOf(rxT(id));
  if(TR.phase==="rest"){
    const nextId=TR.set===1?TR.ids[TR.i]:id;
    w.insertAdjacentHTML("beforeend",`<div class="tset" style="margin-top:8vh">Descanso</div><div class="tbig" id="tcount">0:00</div>
      <div class="tbar"><i id="trbar" style="width:100%"></i></div>
      <p class="tnext">Sigue: <b>${EX[nextId].name}</b> · serie ${TR.set} de ${setsOf(rxT(nextId))}</p>`);
    const f=makeFig(EX[nextId]);f.tr=1;figs.push(f);f.svg.style.width="min(60%,30vh)";w.appendChild(f.svg);
    const r=document.createElement("div");r.className="trow";
    const p=document.createElement("button");p.type="button";p.textContent="+15 s";p.onclick=()=>{TR.end+=15000;TR.total+=15;tickRest()};
    const sk=document.createElement("button");sk.type="button";sk.textContent="Saltar descanso";sk.onclick=()=>{TR.phase="work";drawTrain()};
    r.append(p,sk);w.appendChild(r);
    trT=setInterval(tickRest,250);tickRest();
  }else{
    const f=makeFig(x);f.tr=1;figs.push(f);w.appendChild(f.svg);
    w.insertAdjacentHTML("beforeend",`<h2>${x.name}</h2><p class="tsub">${x.mus} · ${rxT(id)}</p>
      <div class="tset">Serie <b>${TR.set}</b> de ${sets}</div>`);
    const b=document.createElement("button");b.className="tmain";b.type="button";b.textContent="Terminé la serie";
    b.onclick=()=>{
      if(TR.set<sets){TR.set++;}
      else{if(!tk.includes(id))tk.push(id);save();
        let j=TR.i+1;while(j<n&&tk.includes(TR.ids[j]))j++;
        if(j>=n){TR.phase="end";drawTrain();return}TR.i=j;TR.set=1;}
      TR.phase="rest";TR.total=x.rest;TR.end=Date.now()+x.rest*1000;drawTrain();
    };
    w.appendChild(b);
    const det=document.createElement("details");det.className="how";det.innerHTML=`<summary>Cómo hacerlo</summary><ul>${x.tips.map(t=>`<li>${t}</li>`).join("")}</ul>`;w.appendChild(det);
    const r=document.createElement("div");r.className="trow";
    if(TR.i>0){const pv=document.createElement("button");pv.type="button";pv.textContent="← Anterior";pv.onclick=()=>{TR.i--;TR.set=1;drawTrain()};r.appendChild(pv)}
    const sk=document.createElement("button");sk.type="button";sk.textContent="Saltar ejercicio →";
    sk.onclick=()=>{if(TR.i+1>=n){TR.phase="end"}else{TR.i++;TR.set=1}drawTrain()};r.appendChild(sk);w.appendChild(r);
  }
  const wn=document.createElement("p");wn.className="twl";wn.id="twl";wn.textContent=wlTxt();w.appendChild(wn);
  if(RM)for(const f of figs.filter(f=>f.tr))f.draw(f.poses[1%f.poses.length]);
}
function tickRest(){
  const left=Math.max(0,Math.ceil((TR.end-Date.now())/1000));const c=$("tcount");if(!c)return;
  c.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  $("trbar").style.width=Math.max(0,(TR.end-Date.now())/(TR.total*1000))*100+"%";
  if(left<=0){clearInterval(trT);beep1();TR.phase="work";drawTrain()}
}
function trainButton(day,ids,home){
  const b=document.createElement("button");b.type="button";b.className="go wide trainbtn";
  b.innerHTML=`Modo entrenamiento <span style="font-weight:500;opacity:.85">· un ejercicio por vez</span>`;
  b.onclick=()=>startTrain(day,ids,home);return b;
}

function bodyMap(plan,onPick){
  const w=document.createElement("div");w.className="bmap";w.innerHTML=MAP_SVG;
  const chosen=new Set(plan.ids.map(id=>EX[id].g));
  w.querySelectorAll(".m").forEach(m=>{const g=m.dataset.g;
    m.classList.toggle("has",chosen.has(g));m.classList.toggle("sel",rfilter===g);
    m.setAttribute("tabindex","0");m.setAttribute("role","button");m.setAttribute("aria-label",GN[g]);
    const pick=()=>onPick(rfilter===g?null:g);m.onclick=pick;m.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick()}}});
  const cap=document.createElement("div");cap.className="bcap";
  if(rfilter){cap.innerHTML=`<span>Mostrando: <b>${GN[rfilter]}</b></span>`;const b=document.createElement("button");b.type="button";b.textContent="Ver todo";b.onclick=()=>onPick(null);cap.appendChild(b)}
  else cap.innerHTML=`<span>Tocá un músculo para ver sus ejercicios.</span><span class="leg"><i></i>ya elegido</span>`;
  w.appendChild(cap);return w;
}
function rutinaView(v){
  if(!st.setup){const n=document.createElement("p");n.className="note";n.textContent="Primero armá tu rutina como te la marcó el profe. Se hace una sola vez y la podés cambiar cuando quieras.";v.appendChild(n)}
  const s1=sec(v,"Días y hora","¿cuándo vas al gym?");
  const p=document.createElement("div");p.className="panel";
  const order=[1,2,3,4,5,6,0];
  p.innerHTML=`<div class="wdays">${order.map(d=>`<button type="button" data-d="${d}" aria-pressed="${st.days.includes(d)}">${WD[d].slice(0,3)}</button>`).join("")}</div>
    <label class="hr" for="hora">Hora a la que vas <input id="hora" type="time" value="${st.hora}"></label>
    <p class="empty">Los días van rotando: si faltás, el próximo día que vayas seguís con el que te tocaba.${CAP?" Te aviso 30 minutos antes de la hora.":""}</p>`;
  p.querySelectorAll(".wdays button").forEach(b=>b.onclick=()=>{const d=+b.dataset.d;const i=st.days.indexOf(d);if(i<0)st.days.push(d);else st.days.splice(i,1);b.setAttribute("aria-pressed",i<0);save();programarAvisos()});
  p.querySelector("#hora").onchange=ev=>{st.hora=ev.target.value;save();programarAvisos()};
  s1.appendChild(p);
  const s2=sec(v,"Ejercicios","tildá los que hacés");
  const dt=document.createElement("div");dt.className="dtabs";
  ["1","2","3"].forEach(d=>{const b=document.createElement("button");b.type="button";b.setAttribute("aria-pressed",st.rtab===d);b.innerHTML=`<i class="dot" style="background:var(--d${d})"></i>Día ${d}`;
    b.onclick=()=>{st.rtab=d;rfilter=null;save();render()};dt.appendChild(b)});
  s2.appendChild(dt);
  const d=st.rtab;const D=DAYS[d];const plan=st.plan[d];
  const help=document.createElement("p");help.className="empty";help.textContent=`${D.t}. Si el profe te dio otras series o repeticiones, cambialas en el casillero.`;s2.appendChild(help);
  s2.appendChild(bodyMap(plan,g=>{rfilter=g;render()}));
  for(const g of(rfilter?[rfilter]:[...D.g,"abdomen"])){
    const list=Object.keys(EX).filter(id=>EX[id].g===g).sort((a,b)=>(plan.ids.includes(b)-plan.ids.includes(a))||((EX[b].base||0)-(EX[a].base||0)));
    const box=document.createElement("div");box.className="plist";box.innerHTML=`<h4>${GN[g]}</h4>`;
    list.forEach(id=>{const x=EX[id];const on=plan.ids.includes(id);
      const r=document.createElement("div");r.className="prow"+(on?" on":"");
      r.innerHTML=`<label><input type="checkbox" id="pk-${d}-${id}" ${on?"checked":""}><span><b>${x.name}</b><small>${x.mus}${x.casa?" · sin máquina":""}</small></span></label>
        <input type="text" id="rx-${d}-${id}" value="${rxOf(d,id)}" aria-label="Series y repeticiones de ${x.name}" ${on?"":"disabled"}>`;
      const[cb,tx]=r.querySelectorAll("input");
      cb.onchange=()=>{if(cb.checked){if(!plan.ids.includes(id))plan.ids.push(id)}else plan.ids=plan.ids.filter(z=>z!==id);
        st.plan[d]=plan;save();r.classList.toggle("on",cb.checked);tx.disabled=!cb.checked};
      tx.onchange=()=>{const val=tx.value.trim();if(val&&val!==x.rx)plan.rx[id]=val;else delete plan.rx[id];save()};
      box.appendChild(r)});
    s2.appendChild(box);
  }
  const hint=document.createElement("p");hint.className="empty";hint.textContent="Para empezar alcanza con 5 o 6 ejercicios por día.";s2.appendChild(hint);
  if(!st.setup){const b=document.createElement("button");b.type="button";b.className="go wide";b.textContent="Listo, empezar";
    b.onclick=()=>{if(!st.days.length){toast("Elegí al menos un día de la semana.",{ms:3000});return}st.setup=true;st.tab="hoy";save();programarAvisos();render();window.scrollTo({top:0})};v.appendChild(b)}
}
function weekStart(d){const dt=new Date(d+"T12:00:00");dt.setDate(dt.getDate()-((dt.getDay()+6)%7));return ymd(dt)}
function addDays(d,n){const dt=new Date(d+"T12:00:00");dt.setDate(dt.getDate()+n);return ymd(dt)}
function lineChart(vals,labels){
  const W=320,H=150,pl=34,pr=14,pt=16,pb=22,min=Math.min(...vals),max=Math.max(...vals),span=max-min||1;
  const X=i=>pl+(vals.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(vals.length-1)),Y=v=>pt+(H-pt-pb)*(1-(v-min)/span);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso corporal">`;
  for(const v of max===min?[max]:[min,max])s+=`<line x1="${pl}" y1="${Y(v)}" x2="${W-pr}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${nf(v)}</text>`;
  s+=`<polyline fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" points="${vals.map((v,i)=>X(i)+","+Y(v)).join(" ")}"/>`;
  vals.forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===vals.length-1?5:3}" fill="var(--ink)"/>`});
  [0,vals.length-1].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>s+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${labels[i]}</text>`);
  return s+"</svg>";
}
function progView(v){
  const sd=Object.keys(st.done).sort();const wk=weekStart(today);const goal=st.days.length||3;
  const perWeek={};sd.forEach(d=>{const w=weekStart(d);perWeek[w]=(perWeek[w]||0)+1});
  let streak=0,w=(perWeek[wk]||0)>=goal?wk:addDays(wk,-7);while((perWeek[w]||0)>=goal){streak++;w=addDays(w,-7)}
  const month=sd.filter(d=>d.slice(0,7)===today.slice(0,7)).length;
  let wsum=0;for(let i=0;i<7;i++)wsum+=st.water[addDays(today,-i)]||0;
  const t=document.createElement("div");t.className="tiles";
  t.innerHTML=`<div class="tile"><b>${perWeek[wk]||0} de ${goal}</b><span>Entrenamientos esta semana</span></div>
    <div class="tile"><b>${month}</b><span>Entrenamientos este mes</span></div>
    <div class="tile"><b>${streak}</b><span>Semanas seguidas cumplidas</span></div>
    <div class="tile"><b>${nf(wsum*.25/7,1)} L</b><span>Agua por día (promedio 7 días)</span></div>`;
  v.appendChild(t);
  const s3=sec(v,"Peso corporal","una vez por semana, mismo día y hora");const p3=document.createElement("div");p3.className="panel";
  const bw=st.bw.slice().sort((a,b)=>a.d<b.d?-1:1);const lastW=bw[bw.length-1];
  const needs=!lastW||(new Date(today)-new Date(lastW.d))/864e5>=7;
  p3.innerHTML=`${needs?'<p class="empty">Toca pesarse esta semana. Mejor a la mañana y en ayunas.</p>':""}
    <div style="display:flex;gap:8px"><input id="bwin" type="number" inputmode="decimal" step="0.1" min="0" placeholder="Tu peso en kg" style="flex:1;min-width:0"><button type="button" class="go">Guardar</button></div>
    ${bw.length>1?lineChart(bw.slice(-12).map(z=>z.kg),bw.slice(-12).map(z=>fmtD(z.d))):""}
    ${lastW?`<p class="empty">Último: ${nf(lastW.kg)} kg (${fmtD(lastW.d)})${bw.length>1?` · desde el inicio: ${(lastW.kg-bw[0].kg>0?"+":"")+nf(lastW.kg-bw[0].kg)} kg`:""}</p>`:""}`;
  p3.querySelector("button").onclick=()=>{const kg=parseFloat(String(p3.querySelector("input").value).replace(",","."));if(!(kg>0))return;
    st.bw=st.bw.filter(z=>z.d!==today);st.bw.push({d:today,kg});save();render()};
  s3.appendChild(p3);
  const s4=sec(v,"Historial","últimos entrenamientos");const p4=document.createElement("div");p4.className="panel";
  p4.innerHTML=sd.length?`<div class="hist">${sd.slice(-10).reverse().map(d=>`<div><b>${fmtD(d)}</b><span>Día ${st.done[d].day} · ${DAYS[st.done[d].day].t}</span><span>${st.done[d].home?"En casa":"Gym"}</span></div>`).join("")}</div>`
    :`<p class="empty">Cuando toques "Terminé" en el gym, acá queda anotado.</p>`;
  s4.appendChild(p4);
}
function render(){
  const day=st.tab==="rutina"?st.rtab:todayDay();
  document.body.dataset.day=st.tab==="prog"?"p":day;
  tabs();figs=[];
  const v=$("view");v.innerHTML="";
  if(st.tab==="rutina")rutinaView(v);else if(st.tab==="prog")progView(v);else hoyView(v);
  if(RM)for(const f of figs)f.draw(f.poses[1%f.poses.length]);
}
render();if(!RM)requestAnimationFrame(frame);
if(st.inGym)pantallaOn();programarAvisos();

</script>
